<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Renders an agent model for Gloria's replay: orthographic, at eye level, transparent background.
// The world is in game units with the feet at y = 0; the frame spans [bottom, top] vertically and
// [-halfWidth, halfWidth] horizontally, so the replay can place it to scale.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const size = 256;
const frame = { bottom: -4, top: 80, halfWidth: 42 };

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-frame.halfWidth, frame.halfWidth, frame.top, frame.bottom, 0.1, 1000);
// Straight on from +Z: the frame's vertical range comes from the projection, not from tilting the camera.
camera.position.set(0, 0, 300);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x40444c, 2.4));
const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(-120, 160, 200);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9cc6f5, 2.2);
rim.position.set(150, 120, -200);
scene.add(rim);

let root = null;      // yaw turns this
let model = null;     // the loaded scene, normalized to 72 units tall
let mixer = null;
let rest = new Map(); // bone name -> rest quaternion
let matched = {};     // pose name -> Map(bone name -> quaternion) copied from another model, see matchPoses
let reskinned = null; // { skins: [{ attributes, original, poses: { name: weights } }] }, see reskinCrotch

const loader = new GLTFLoader();
const boneRotations = m => { const r = new Map(); m.traverse(o => { if (o.isBone) r.set(o.name, o.quaternion.clone()); }); return r; };
const setRotations = (m, r) => m.traverse(o => { if (o.isBone && r.has(o.name)) o.quaternion.copy(r.get(o.name)); });
// pose: { boneName: [x, y, z] degrees added to the current rotation }.
const addRotations = (m, pose) => m.traverse(o => {
    const r = o.isBone && pose?.[o.name];
    if (r) o.quaternion.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(...r.map(THREE.MathUtils.degToRad))));
});

window.setup = async (url, config) => {
    const gltf = await loader.loadAsync(url);
    model = gltf.scene;
    root = new THREE.Group();
    root.add(model);
    scene.add(root);

    model.rotation.y = THREE.MathUtils.degToRad(config.yawOffset ?? 0);
    if (config.clip && gltf.animations.length > 0) {
        const clip = gltf.animations.find(a => a.name === config.clip) ?? gltf.animations[0];
        mixer = new THREE.AnimationMixer(model);
        mixer.clipAction(clip).play();
        mixer.setTime(config.clipTime ?? 0);
    }

    model.updateMatrixWorld(true);
    if (config.reskinCrotch) reskinCrotch(model, config.reskinCrotch);
    rest = boneRotations(model);
    if (config.matchFrom) {
        matched = await matchPoses(model, config.matchFrom);
        // Normalize the height in the matched standing pose.
        if (matched.stand) setRotations(model, matched.stand);
        model.updateMatrixWorld(true);
    }

    const box = new THREE.Box3().setFromObject(model);
    const height = box.max.y - box.min.y;
    const scale = 72 / height;
    model.scale.multiplyScalar(scale);
    model.updateMatrixWorld(true);
    const scaled = new THREE.Box3().setFromObject(model);
    const center = scaled.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= scaled.min.y;

    const bones = [];
    model.traverse(o => { if (o.isBone) bones.push(o.parent?.isBone ? `${o.name} <- ${o.parent.name}` : o.name); });
    return { bones, clips: gltf.animations.map(a => a.name), height };
};

// Some rigs weight the crotch of the pants to the hips (or the root above them, or partly the opposite thigh), so
// it stays behind as a web of cloth when the thighs spread. This hands that weight on vertices below the hip joint
// to the thighs: more the lower the vertex, split between left and right by which side of the middle it is on.
// Positions are taken in the bind pose. options: { hip, left, right, spine, from, depth }: bone names (from: the
// bones whose weight is handed over), and per pose ({ stand: 1, crouch: 2 }) the depth below the hip, as a fraction
// of the hip-to-spine length, at which it is fully handed over. A deep crouch tears if it is handed over too soon.
function reskinCrotch(target, options) {
    reskinned = { skins: [] };
    target.traverse(mesh => {
        if (!mesh.isSkinnedMesh) return;
        const bones = mesh.skeleton.bones;
        const index = name => bones.findIndex(b => b.name === name);
        const [hip, left, right, spine] = [options.hip, options.left, options.right, options.spine].map(index);
        const from = (options.from ?? [options.hip]).map(index);
        if ([hip, left, right, spine, ...from].includes(-1)) return;

        const bindPosition = i => new THREE.Vector3().setFromMatrixPosition(mesh.skeleton.boneInverses[i].clone().invert());
        const hipAt = bindPosition(hip);
        const up = bindPosition(spine).sub(hipAt);
        const length = up.length();
        up.normalize();
        const across = bindPosition(left).sub(bindPosition(right));
        const half = across.length() / 2;
        across.normalize();

        const position = mesh.geometry.attributes.position;
        const attributes = [mesh.geometry.attributes.skinIndex, mesh.geometry.attributes.skinWeight];
        const [skinIndex, skinWeight] = attributes;
        const original = attributes.map(a => a.array.slice());
        const poses = {};
        for (const [pose, depth] of Object.entries(options.depth)) {
            attributes.forEach((a, k) => a.array.set(original[k]));
            const full = length * depth;
            const v = new THREE.Vector3();
            for (let i = 0; i < position.count; i++) {
                const slots = [0, 1, 2, 3].map(k => ({ bone: skinIndex.getComponent(i, k), weight: skinWeight.getComponent(i, k) }));
                if (!slots.some(s => from.includes(s.bone) && s.weight > 0)) continue;

                v.fromBufferAttribute(position, i).applyMatrix4(mesh.bindMatrix).sub(hipAt);
                const below = -v.dot(up);
                if (below <= 0) continue;

                // Free the handed-over share, then give it to the thighs: the nearer one first, and if the other
                // has no slot left, the nearer one takes its share too.
                const fraction = Math.min(below / full, 1);
                let moved = 0;
                for (const slot of slots) {
                    if (!from.includes(slot.bone) || slot.weight <= 0) continue;
                    moved += slot.weight * fraction;
                    slot.weight -= slot.weight * fraction;
                }

                const toLeft = THREE.MathUtils.smoothstep(v.dot(across), -half * 0.5, half * 0.5);
                const sides = toLeft >= 0.5 ? [[left, toLeft], [right, 1 - toLeft]] : [[right, 1 - toLeft], [left, toLeft]];
                let first = null;
                for (const [bone, share] of sides) {
                    const slot = slots.find(s => s.bone === bone && s.weight > 0)
                        ?? slots.find(s => s.weight === 0)
                        ?? first
                        ?? slots.find(s => from.includes(s.bone)); // no room at all: it stays where it was
                    if (slot.weight === 0) slot.bone = bone;
                    slot.weight += moved * share;
                    first ??= slot;
                }

                slots.forEach((s, k) => { skinIndex.setComponent(i, k, s.bone); skinWeight.setComponent(i, k, s.weight); });
            }

            poses[pose] = attributes.map(a => a.array.slice());
        }

        attributes.forEach((a, k) => a.array.set(original[k]));
        reskinned.skins.push({ attributes, original, poses });
    });
}

// Copies another model's poses onto this one by limb direction, so two rigs with different bone axes can share
// a stance. from: { file, clip, clipTime, yawOffset, poses: { stand: rotations, crouch: rotations },
// bones: [{ source: [bone, toward], target: [bone, toward], sourceSide: [a, b], targetSide: [a, b], weight }, ...] }.
// The source is posed as for its own sprites (clip, then that pose's rotations), and each target bone is turned
// so that the line from it to "toward" points the way the source's does; the optional side pair (e.g. shoulder
// to shoulder, index to pinky) then sets the twist around that line. Parents come first in the list, so children
// are matched after their parent has moved. Returns the target's rotations for each pose.
async function matchPoses(target, from) {
    const gltf = await loader.loadAsync(from.file);
    const source = gltf.scene;
    source.rotation.y = THREE.MathUtils.degToRad(from.yawOffset ?? 0);
    if (from.clip) {
        const mixer = new THREE.AnimationMixer(source);
        mixer.clipAction(gltf.animations.find(a => a.name === from.clip) ?? gltf.animations[0]).play();
        mixer.setTime(from.clipTime ?? 0);
    }
    source.updateMatrixWorld(true);
    const sourceRest = boneRotations(source);
    const targetRest = boneRotations(target);

    const poses = {};
    for (const [name, rotations] of Object.entries(from.poses ?? { stand: null })) {
        setRotations(source, sourceRest);
        addRotations(source, rotations);
        source.updateMatrixWorld(true);
        setRotations(target, targetRest);
        target.updateMatrixWorld(true);
        matchPose(source, target, from.bones);
        poses[name] = boneRotations(target);
    }

    setRotations(target, targetRest);
    target.updateMatrixWorld(true);
    return poses;
}

function matchPose(source, target, bones) {
    const worldPosition = o => o.getWorldPosition(new THREE.Vector3());
    const direction = (bone, child) => worldPosition(child).sub(worldPosition(bone)).normalize();
    const find = (model, names) => (names ?? []).map(n => model.getObjectByName(n));
    for (const entry of bones) {
        const s = find(source, entry.source), t = find(target, entry.target);
        const sSide = find(source, entry.sourceSide), tSide = find(target, entry.targetSide);
        if ([...s, ...t, ...sSide, ...tSide].includes(undefined)) {
            console.log(`matchPose: missing a bone in ${JSON.stringify(entry)}`);
            continue;
        }

        const bone = t[0];
        const axis = direction(...s);
        const turn = new THREE.Quaternion().setFromUnitVectors(direction(...t), axis);
        if (sSide.length === 2 && tSide.length === 2) {
            // Twist about the matched axis so the side lines agree too, both projected off the axis.
            const flat = v => v.sub(axis.clone().multiplyScalar(v.dot(axis))).normalize();
            const want = flat(direction(...sSide));
            const have = flat(direction(...tSide).applyQuaternion(turn));
            const angle = Math.atan2(axis.dot(new THREE.Vector3().crossVectors(have, want)), have.dot(want));
            turn.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, angle));
        }

        // A weight below 1 takes only part of the turn, e.g. a shorter stride where the mesh would stretch.
        if (entry.weight !== undefined) turn.slerp(new THREE.Quaternion(), 1 - entry.weight);

        const world = bone.getWorldQuaternion(new THREE.Quaternion());
        const parent = bone.parent.getWorldQuaternion(new THREE.Quaternion());
        bone.quaternion.copy(parent.invert().multiply(turn.multiply(world)));
        target.updateMatrixWorld(true);
    }
}

// name: the pose ("stand", "crouch") whose matched rotations apply, if any; pose: rotations added on top;
// squash scales the height (crouch fallback).
window.render = (yaw, name, pose, squash) => {
    setRotations(model, rest);
    for (const skin of reskinned?.skins ?? []) {
        const weights = skin.poses[name] ?? skin.original;
        skin.attributes.forEach((attribute, k) => { attribute.array.set(weights[k]); attribute.needsUpdate = true; });
    }
    if (matched[name]) setRotations(model, matched[name]);
    addRotations(model, pose);
    root.rotation.y = THREE.MathUtils.degToRad(yaw);
    root.scale.set(1, squash ?? 1, 1);
    root.position.y = 0;

    // A posed crouch bends the legs, which would lift the feet: put them back on the ground. Rendering once
    // updates the skeletons, so the skinned bounding boxes follow the pose.
    renderer.render(scene, camera);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    model.traverse(o => {
        if (!o.isSkinnedMesh) return;
        o.computeBoundingBox();
        box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
    });
    if (!box.isEmpty()) root.position.y = -box.min.y;
    renderer.render(scene, camera);
    return { ...frame, height: box.isEmpty() ? null : box.max.y - box.min.y };
};

window.ready = true;
</script>
</body>
</html>
